[package]
name = "tuxhub-autoclicker"
version = "0.1.0"
edition = "2024"
description = "Autoclicker für Linux (Wayland & X11) über uinput – eigenständig oder im tuxhub"
license = "MIT"
authors = ["Snolte"]

[dependencies]
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
