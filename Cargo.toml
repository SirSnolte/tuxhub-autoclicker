[package]
name = "tuxly-autoclicker"
version = "0.3.0"
edition = "2024"
description = "Autoclicker and input macros for Linux (Wayland and X11), standalone or integrated in tuxly"
license = "MIT"
authors = ["SirSnolte"]

[dependencies]
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
