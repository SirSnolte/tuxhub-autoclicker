[package]
name = "tuxhub-autoclicker"
version = "0.3.1"
edition = "2024"
description = "Autoclicker and input macros for Linux (Wayland and X11), standalone or integrated in tuxhub"
license = "MIT"
authors = ["SirSnolte"]
repository = "https://github.com/SirSnolte/tuxhub-autoclicker"

[dependencies]
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
tao = "0.37"
wry = "0.57"

[profile.release]
lto = true
codegen-units = 1
strip = true
