<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Autoclicker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/__tuxhub/bridge.js"></script>
  </head>
  <body>
    <p class="notice" data-i18n="notice.anticheat"></p>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="clicker" class="active" data-i18n="tab.clicker"></button>
      <button role="tab" data-tab="macros" data-i18n="tab.macros"></button>
    </div>

    <section id="tab-clicker">
      <div class="row">
        <button class="primary" data-action="start" data-i18n="clicker.start"></button>
        <button data-action="stop" data-i18n="clicker.stop"></button>
        <span class="muted" data-i18n="clicker.hotkeys"></span>
      </div>
      <p class="status" id="clicker-status" aria-live="polite"></p>
      <div class="form" id="clicker-form"></div>
      <div class="form">
        <div class="field">
          <span>
            <span data-i18n="clicker.stopKey"></span>
            <small class="muted" data-i18n="clicker.stopKeyHelp"></small>
          </span>
          <span class="row">
            <kbd id="stop-key"></kbd>
            <button class="small" id="stop-set" data-i18n="key.set"></button>
            <button class="small danger" id="stop-clear" data-i18n="key.clear"></button>
          </span>
        </div>
      </div>
      <p class="muted setup">
        <span data-i18n="clicker.setupHint"></span>
        <button class="small" data-action="setup" data-i18n="clicker.setup"></button>
      </p>
    </section>

    <section id="tab-macros" class="hidden">
      <div id="list-view">
        <div class="row between">
          <div class="row">
            <button class="primary" id="rec-btn"></button>
            <span class="muted" data-i18n="macros.recordHint"></span>
          </div>
          <button id="new-btn" data-i18n="macros.new"></button>
        </div>
        <p class="status" id="macro-status" aria-live="polite"></p>
        <p class="notice" data-i18n="macros.privacy"></p>
        <table>
          <thead>
            <tr>
              <th data-i18n="macros.name"></th>
              <th class="num" data-i18n="macros.steps"></th>
              <th class="num" data-i18n="macros.duration"></th>
              <th data-i18n="macros.repeat"></th>
              <th data-i18n="macros.hotkey"></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="macro-rows"></tbody>
        </table>
        <p class="muted empty" id="empty" data-i18n="macros.empty"></p>
      </div>

      <div id="editor" class="hidden card">
        <div class="row between editor-head">
          <h2 id="ed-title"></h2>
          <div class="row">
            <button id="ed-cancel" data-i18n="editor.cancel"></button>
            <button class="primary" id="ed-save" data-i18n="editor.save"></button>
          </div>
        </div>
        <div class="grid2">
          <label><span data-i18n="editor.name"></span><input id="ed-name" /></label>
          <label><span data-i18n="editor.repeat"></span><input id="ed-repeat" type="number" min="0" max="100000" /></label>
          <label><span data-i18n="editor.speed"></span><input id="ed-speed" type="number" min="0.1" max="10" step="0.1" /></label>
          <label>
            <span data-i18n="editor.hotkey"></span>
            <span class="row"><input id="ed-shortcut" class="grow" /><button class="small" id="ed-capture" data-i18n="key.set"></button></span>
          </label>
        </div>
        <div class="row add-row">
          <span class="muted" data-i18n="editor.add"></span>
          <select id="add-key" aria-label="Key"></select>
          <button class="small" data-add="tap" data-i18n="editor.tap"></button>
          <button class="small" data-add="down" data-i18n="editor.press"></button>
          <button class="small" data-add="up" data-i18n="editor.release"></button>
          <button class="small" data-add="wait" data-i18n="editor.wait"></button>
          <button class="small" id="ed-scale" data-i18n="editor.scale" data-i18n-title="editor.scaleHelp"></button>
        </div>
        <div class="steps">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th class="num" data-i18n="editor.delay"></th>
                <th data-i18n="editor.action"></th>
                <th></th>
              </tr>
            </thead>
            <tbody id="step-rows"></tbody>
          </table>
        </div>
        <p class="muted" id="ed-summary"></p>
        <p class="error" id="ed-error"></p>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
