# Integration with tuxhub (level 2). See https://github.com/SirSnolte/tuxhub
#
# The settings live in the tool's own background service, so tuxhub and the
# tool's window always show the same state. The
# interface in ui/ is localized, shows the usage notice itself and runs both
# in tuxhub and in the window. The manifest only declares the actions and
# their default hotkeys.

id = "autoclicker"
name = "Autoclicker"
version = "0.4.0"
description = "Automated clicking and keyboard and mouse macros for Wayland and X11."
icon = "assets/icon.svg"

ui = "ui/index.html"

[run]
command = "tuxhub-autoclicker"

[rpc]
command = "tuxhub-autoclicker"
args = ["--tuxhub"]

[uninstall]
command = "tuxhub-autoclicker"
args = ["uninstall"]

[[actions]]
id = "start"
label = "Start"
primary = true

[[actions]]
id = "stop"
label = "Stop"

[[actions]]
id = "toggle"
label = "Start or stop clicking"
shortcut = "F8"

[[actions]]
id = "record"
label = "Start or stop macro recording"
shortcut = "F9"

[[actions]]
id = "panic"
label = "Stop everything"
shortcut = "F10"

[[actions]]
id = "setup"
label = "Set up input device access"
